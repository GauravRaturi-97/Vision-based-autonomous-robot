# Render Blueprint for AURA-Fleet Autonomous Robotics Terminal
# Best Use of Render Challenge - Hack-in-Hills '26

services:
  - type: web
    name: aura-fleet-terminal
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: deploy/Dockerfile
    healthCheckPath: /api/telemetry
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: APP_ENV
        value: production
